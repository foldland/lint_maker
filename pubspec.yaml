name: _dart_lint_maker
description: (META) packages related to lints and linting.
repository: https://github.com/foldland/lint_maker
issue_tracker: https://github.com/foldland/lint_maker/issues
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  # ignore: path_does_not_exist
  - packages/*

dev_dependencies:
  build_runner: ^2.11.0
  lint_maker:
    path: packages/lint_maker
  melos: ^8.0.0

melos:
  repository:
    type: gitlab
    origin: https://gitlab.fold.land
    owner: tools
    name: dart_lint_maker

  sdkPath: .fvm/flutter_sdk

  command:
    version:
      releaseUrl: true
      branch: main
      includeScopes: false
      includeCommitId: true
      linkToCommits: false
      workspaceChangelog: true
      updateGitTagRefs: false
      fetchTags: true

  scripts:
    test:
      description: Tests all packages with coverage.
      exec:
        command: >
          dart pub global run coverde optimize-tests --exclude '**/fixtures/**' --include 'test/**_test.dart' --output test/optimized_test.dart &&
          dart test --coverage-path coverage/lcov.info --coverage-package MELOS_PACKAGE_NAME --test-randomize-ordering-seed random test/optimized_test.dart
        concurrency: 1
        failFast: true
      packageFilters:
        dirExists: test
    test:transform_coverage:
      description: (Internal) transforms the coverage to be collected.
      exec:
        command: dart pub global run coverde transform --input coverage/lcov.info --output "$MELOS_ROOT_PATH/coverage/filtered.lcov.info" --transformations skip-by-glob="**/*.g.dart" --transformations skip-by-glob="lib/src/generated/**"
        concurrency: 1
      packageFilters:
        fileExists: coverage/lcov.info
    test:collect_coverage:
      description: Merge all packages coverage trace files ignoring data related to generated files.
      run: >
        dart pub global run coverde rm --no-dry-run "$MELOS_ROOT_PATH/coverage/filtered.lcov.info" &&
        mkdir -p "$MELOS_ROOT_PATH/coverage" &&
        melos run test:transform_coverage --no-select &&
        dart pub global run cobertura convert -i coverage/filtered.lcov.info &&
        dart pub global run cobertura show -i coverage/filtered.lcov.info
    pana:
      description: Run the dart package analysis.
      exec:
        command: dart pub global run pana --exit-code-threshold 10 --flutter-sdk "$MELOS_ROOT_PATH/.fvm/flutter_sdk"
        concurrency: 1
        failFast: true
      packageFilters:
        noPrivate: true
    build_runner:
      description: Generate build output for every package.
      run: dart run build_runner build --workspace
    lint_maker:
      description: Run lint_maker to update lints.
      run: dart run lint_maker
